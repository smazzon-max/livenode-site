<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Diagnostica — LiveNode</title>
<meta name="theme-color" content="#09090B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2309090B'/%3E%3Crect x='14' y='14' width='36' height='36' fill='none' stroke='%23f4f4f5' stroke-width='5'/%3E%3Crect x='24' y='24' width='16' height='16' fill='%23FF4A00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><div class="w"><a class="logo" href="./"><i></i>LiveNode</a><nav><a href="account.html">Account</a></nav></div></header>
<main class="w"><div class="doc">
  <h1>Diagno<s>stica</s></h1>
  <p class="lead">Controlla che Supabase, le funzioni e Stripe siano configurati. Non mostra dati riservati. Elimina questa pagina quando hai finito.</p>
  <div class="row" style="margin:20px 0"><button class="key pri" id="run">Esegui controlli</button></div>
  <div class="box"><div class="bh"><span>Esito</span><b id="sum"></b></div><div class="bb" id="out"><p class="empty">Premi «Esegui controlli».</p></div></div>
</div></main>
<footer><div class="w"><div><a href="terms.html">Termini</a><a href="privacy.html">Privacy</a><a href="mailto:marco@piol.it">Contatti</a></div><div>© Production Management S.r.l. · Piemme</div></div></footer>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const rows = [];
function add(ok, title, detail) { rows.push({ ok, title, detail }); render(); }
function render() {
  $("#out").innerHTML = rows.map(r => `<div class="item"><div><strong>${r.title}</strong><br><small>${r.detail || ""}</small></div><span class="stat"><i class="led ${r.ok === true ? "" : r.ok === "warn" ? "y" : "r"}"></i>${r.ok === true ? "OK" : r.ok === "warn" ? "Controlla" : "Errore"}</span></div>`).join("");
  const bad = rows.filter(r => r.ok === false).length, w = rows.filter(r => r.ok === "warn").length;
  $("#sum").textContent = bad ? bad + " da sistemare" : w ? "ok, con avvisi" : "tutto ok";
}
const H = { apikey: CFG.anonKey, Authorization: "Bearer " + CFG.anonKey };
async function t(url, opt) { try { const r = await fetch(url, opt); return r; } catch (e) { return null; } }

$("#run").onclick = async () => {
  rows.length = 0; render();
  // 1. configurazione
  const keyOk = CFG.anonKey && CFG.anonKey.split(".").length === 3 && !/INSERISCI|xxx/i.test(CFG.anonKey);
  add(keyOk, "Chiave pubblica (anon) in config.js", keyOk ? "Formato valido" : "Controlla Project Settings › API › anon public");
  add(location.protocol === "https:" || location.hostname === "localhost" ? true : "warn", "Il sito è servito in HTTPS", location.origin);

  // 2. database e tabella piani
  const r = await t(`${CFG.supabaseUrl}/rest/v1/plans?select=key,storage_gb&order=sort`, { headers: H });
  if (!r) add(false, "Supabase raggiungibile", "Nessuna risposta: controlla supabaseUrl in config.js");
  else if (r.status === 200) {
    const j = await r.json(); add(j.length === 3, "Tabella plans (schema.sql eseguito)", j.length === 3 ? j.map(p => p.key + " " + p.storage_gb + "GB").join(" · ") : "Righe trovate: " + j.length + " (attese 3)");
  } else add(false, "Tabella plans", "HTTP " + r.status + ": esegui schema.sql nello SQL Editor");

  // 3. tabelle protette (senza login non devono restituire dati)
  for (const tb of ["subscriptions", "devices", "customers", "device_links"]) {
    const x = await t(`${CFG.supabaseUrl}/rest/v1/${tb}?select=*&limit=1`, { headers: H });
    if (!x) { add(false, "Tabella " + tb, "Nessuna risposta"); continue; }
    if (x.status === 404) { add(false, "Tabella " + tb, "Non esiste: esegui schema.sql"); continue; }
    const j = x.status === 200 ? await x.json() : [];
    add(j.length === 0, "Protezione RLS su " + tb, j.length === 0 ? "Nessun dato visibile da anonimi" : "ATTENZIONE: dati leggibili da anonimi! Attiva RLS");
  }

  // 4. impostazioni auth
  const a = await t(`${CFG.supabaseUrl}/auth/v1/settings`, { headers: { apikey: CFG.anonKey } });
  if (a && a.ok) {
    const s = await a.json();
    add(!!(s.external && s.external.email), "Accesso con email attivo", s.external && s.external.email ? "" : "Authentication › Providers › Email");
    add(s.mailer_autoconfirm ? "warn" : true, "Conferma email obbligatoria", s.mailer_autoconfirm ? "È disattivata: chiunque può registrarsi con email non sue. Attiva «Confirm email»" : "Attiva");
    add(s.disable_signup ? "warn" : true, "Registrazioni aperte", s.disable_signup ? "Le registrazioni sono disattivate" : "Aperte");
  } else add(false, "Impostazioni Auth", "Non leggibili");

  // 5. funzioni
  for (const f of ["device", "checkout", "portal", "stripe-webhook", "delete-account", "cloud"]) {
    const x = await t(`${CFG.functions}/${f}`, { method: "OPTIONS" });
    const ok = !!x && x.status !== 404;
    add(ok, "Funzione " + f, !x ? "Nessuna risposta" : x.status === 404 ? "Non pubblicata" : "Pubblicata");
  }
  // device/start è pubblica: prova reale
  const s = await t(`${CFG.functions}/device`, { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.anonKey }, body: JSON.stringify({ action: "start", device_name: "diagnostica" }) });
  if (s && s.ok) { const j = await s.json(); add(!!j.code, "Collegamento Mac (device › start)", j.code ? "Codice generato: " + j.code : "Risposta anomala"); }
  else add(false, "Collegamento Mac (device › start)", s ? "HTTP " + s.status + ": controlla «Verify JWT» OFF e i log della funzione" : "Nessuna risposta");

  // 5b. cloud: senza accesso deve rispondere 401 (se risponde 500 mancano i segreti dello storage)
  const cl = await t(`${CFG.functions}/cloud`, { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.anonKey }, body: JSON.stringify({ action: "quota" }) });
  add(cl && cl.status === 401, "Cloud registrazioni protetto", cl ? "HTTP " + cl.status + (cl.status === 401 ? "" : " (atteso 401)") : "Nessuna risposta");
  // 6. webhook: senza firma deve rifiutare
  const wh = await t(`${CFG.functions}/stripe-webhook`, { method: "POST", body: "{}" });
  add(wh && wh.status === 400, "Webhook Stripe protetto", wh ? (wh.status === 400 ? "Rifiuta le richieste senza firma" : "HTTP " + wh.status + " (atteso 400)") : "Nessuna risposta");
  // 7. checkout senza login → 401
  const co = await t(`${CFG.functions}/checkout`, { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.anonKey }, body: JSON.stringify({ plan: "cloud_start" }) });
  add(co && co.status === 401, "Checkout richiede il login", co ? "HTTP " + co.status + (co.status === 401 ? "" : " (atteso 401)") : "Nessuna risposta");
};
</script>
</body>
</html>
