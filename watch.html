<!doctype html>
<html lang="en" data-auto="always">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recording — LiveNode</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Crect x='14' y='14' width='36' height='36' fill='none' stroke='%23f5f5f7' stroke-width='5'/%3E%3Crect x='24' y='24' width='16' height='16' fill='%23FF4A00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<style>
.player{padding:40px 0 80px;max-width:1000px;margin:0 auto}
#msg{margin-top:0}
.player h1{font-size:clamp(30px,4.6vw,52px);margin:0 0 6px}
.frame{margin-top:22px;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:16/9;position:relative;box-shadow:0 30px 70px -30px #0006}
.frame video{width:100%;height:100%;display:block;background:#000}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin:8px 0 0;font-size:15px;color:var(--mut)}
.meta b{color:var(--ink);font-weight:600}
.bar2{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
</style>
<script src="theme.js"></script>
</head>
<body>
<header class="top"><div class="w"><a class="logo" href="./"><i></i>LiveNode</a><nav><a href="./">Discover LiveNode</a><button class="theme" type="button" data-theme-toggle aria-label="Light or dark mode" title="Light or dark mode"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button></nav></div></header>
<main class="w"><div class="player">
  <div id="msg" class="msg hidden"></div>
  <div id="box" class="hidden">
    <h1 id="title"></h1>
    <div class="meta"><span>Length <b id="dur"></b></span><span>Size <b id="size"></b></span><span id="exp"></span></div>
    <div class="frame"><video id="v" controls playsinline preload="metadata"></video></div>
    <div class="bar2"><a class="key pri" id="dl" href="#">Download</a><span class="note">Recorded with LiveNode</span></div>
  </div>
</div></main>
<footer><div class="w"><div><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div><div>© Production Management S.r.l. · <a href="https://www.piemme.srl">Piemme</a></div></div></footer>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const t = new URLSearchParams(location.search).get("t") || "";
const clock = s => s == null ? "—" : [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n, i) => i ? String(n).padStart(2, "0") : n).join(":");
const sz = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.round(b / 1e6) + " MB";
function fail(text) { const m = $("#msg"); m.className = "msg err"; m.textContent = text; }
(async () => {
  if (t.length < 16) return fail("Invalid link.");
  try {
    const r = await fetch(`${CFG.functions}/cloud`, {
      method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.anonKey }, body: JSON.stringify({ action: "watch", t }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 410) return fail("This link has expired.");
    if (!r.ok) return fail("Recording not found. The link may have been revoked.");
    document.title = d.title + " — LiveNode";
    $("#title").textContent = d.title; $("#dur").textContent = clock(d.duration_sec); $("#size").textContent = sz(d.size_bytes);
    $("#exp").textContent = d.expires ? "Available until " + new Date(d.expires).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";
    $("#v").src = d.play; $("#dl").href = d.download;
    $("#box").classList.remove("hidden");
  } catch (e) { fail("We couldn't load the recording. Try again."); }
})();
</script>
</body>
</html>
