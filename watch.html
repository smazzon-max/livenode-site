<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrazione — LiveNode</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d1d1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Crect x='15' y='15' width='34' height='34' rx='8' fill='none' stroke='%23f5f5f7' stroke-width='5'/%3E%3Crect x='25' y='25' width='14' height='14' rx='3' fill='%23FF4A00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.player{padding:40px 0 80px;max-width:1000px;margin:0 auto}
#msg{margin-top:0}
.player h1{font-size:clamp(30px,4.6vw,52px);margin:0 0 6px}
.frame{margin-top:22px;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:16/9;position:relative;box-shadow:0 30px 70px -30px #0006}
.frame video{width:100%;height:100%;display:block;background:#000}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin:8px 0 0;font-size:15px;color:var(--mut)}
.meta b{color:var(--ink);font-weight:600}
.bar2{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
</style>
</head>
<body>
<header class="top"><div class="w"><a class="logo" href="./"><i></i>LiveNode</a><nav><a href="./">Scopri LiveNode</a></nav></div></header>
<main class="w"><div class="player">
  <div id="msg" class="msg hidden"></div>
  <div id="box" class="hidden">
    <h1 id="title"></h1>
    <div class="meta"><span>Durata <b id="dur"></b></span><span>Peso <b id="size"></b></span><span id="exp"></span></div>
    <div class="frame"><video id="v" controls playsinline preload="metadata"></video></div>
    <div class="bar2"><a class="key pri" id="dl" href="#">Scarica</a><span class="note">Registrata con LiveNode</span></div>
  </div>
</div></main>
<footer><div class="w"><div><a href="privacy.html">Privacy</a><a href="terms.html">Termini</a></div><div>© Production Management S.r.l. · Piemme</div></div></footer>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const t = new URLSearchParams(location.search).get("t") || "";
const clock = s => s == null ? "—" : [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n, i) => i ? String(n).padStart(2, "0") : n).join(":");
const sz = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.round(b / 1e6) + " MB";
function fail(text) { const m = $("#msg"); m.className = "msg err"; m.textContent = text; }
(async () => {
  if (t.length < 16) return fail("Link non valido.");
  try {
    const r = await fetch(`${CFG.functions}/cloud`, {
      method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.anonKey }, body: JSON.stringify({ action: "watch", t }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 410) return fail("Questo link è scaduto.");
    if (!r.ok) return fail("Registrazione non trovata. Il link potrebbe essere stato revocato.");
    document.title = d.title + " — LiveNode";
    $("#title").textContent = d.title; $("#dur").textContent = clock(d.duration_sec); $("#size").textContent = sz(d.size_bytes);
    $("#exp").textContent = d.expires ? "Disponibile fino al " + new Date(d.expires).toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }) : "";
    $("#v").src = d.play; $("#dl").href = d.download;
    $("#box").classList.remove("hidden");
  } catch (e) { fail("Non riesco a caricare la registrazione. Riprova."); }
})();
</script>
</body>
</html>
