<script>
(async () => {
  const box = document.getElementById("rel");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  try {
    const r = await fetch("../update.json", { cache: "no-store" });
    const u = await r.json();
    box.innerHTML = `<p class="eyebrow">Ultima versione</p><h2>LiveNode ${esc(u.version)}</h2><p>${esc(u.notes || "")}</p><a class="key pri" href="${esc(CFG.dmgUrl)}">Scarica la versione ${esc(u.version)}</a>`;
  } catch (e) { box.innerHTML = `<p>Non riesco a leggere le novità. <a href="./#download">Vai al download</a>.</p>`; }
})();
</script>
