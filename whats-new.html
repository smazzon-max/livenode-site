<script>
(async () => {
  const box = document.getElementById("rel");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  try {
    const r = await fetch("update.json", { cache: "no-store" });
    const u = await r.json();
    box.innerHTML = `<p class="eyebrow">Latest version</p><h2>LiveNode ${esc(u.version)}</h2><p>${esc(u.notes_en || u.notes || "")}</p><a class="key pri" href="${esc(CFG.dmgUrl)}">Download version ${esc(u.version)}</a>`;
  } catch (e) { box.innerHTML = `<p>We couldn't load the release notes. <a href="./#download">Go to download</a>.</p>`; }
})();
